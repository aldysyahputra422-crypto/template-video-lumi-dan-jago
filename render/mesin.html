<!doctype html><html><head><meta charset="utf-8"><title>Mesin stickman Ata</title>
<style>
@font-face{font-family:'Baloo';src:url('/render/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2') format('woff2');font-weight:800}
@font-face{font-family:'Mont';src:url('/render/node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Mont';src:url('/render/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2');font-weight:800}
html,body{margin:0;background:#000}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#0B0C10;font-family:'Baloo',sans-serif}
#layar{position:absolute;inset:0}
#ata{position:absolute;transform-origin:50% 100%;will-change:transform;opacity:0}
</style></head><body>
<div id="stage"><svg id="layar" width="720" height="1280" viewBox="0 0 720 1280"></svg><img id="ata"></div>
<script type="module">
// Mesin stickman: membaca timeline.json (scripts/linimasa.py) dan menggambar satu frame untuk waktu t.
// Semua nama di sini HARUS sama dengan config/kosakata.yaml (dijaga tests/test_mesin.py).
const TL = await (await fetch(new URLSearchParams(location.search).get('tl') || '/ep/timeline.json')).json();
const $ = id => document.getElementById(id);
const W = 720, H = 1280, G = 1085;                       // G = garis lantai
const C = {bg:'#08080A', s1:'#0E0E10', s2:'#161618', s3:'#1F1F22', s4:'#2C2C30', cahaya:'#E8A847', cahaya2:'#F0D9A8', kar:'#C3562A',
  krem:'#F6E9D8', kepala:'#EDEDED', kulit:'#F2D3A8', garis:'#3C3C40', tinta:'#1E1E20', hijau:'#3E5A44', bintang:'#BDBDBD', tepi:'#2A2A2A'};
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ez = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const keluar = x => 1 - Math.pow(1 - cl(x), 3);
const pantul = x => { x = cl(x); return x >= 1 ? 1 : keluar(x) + Math.sin(x * Math.PI) * .18; };
let ACAK = 7; const acak = () => (ACAK = (ACAK * 16807) % 2147483647) / 2147483647;
const POS = {jauh_kiri: 95, kiri: 190, tengah: 360, kanan: 530, jauh_kanan: 625};
const ST = (w = 6, c = C.tinta) => `stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

// ---------- LATAR (gelap, sesuai tempat) ----------
function bintang(n, seed) { ACAK = seed; let s = ''; for (let i = 0; i < n; i++) s += `<circle cx="${acak() * 720}" cy="${acak() * 520}" r="${.8 + acak() * 1.6}" fill="${C.bintang}" opacity="${.25 + acak() * .5}"/>`; return s; }
function jendelaKota(x0, w, h, seed) { ACAK = seed; let s = ''; for (let y = G - h + 20; y < G - 30; y += 34) for (let x = x0 + 12; x < x0 + w - 18; x += 26) if (acak() > .55) s += `<rect x="${x}" y="${y}" width="12" height="16" fill="${C.cahaya}" opacity="${.25 + acak() * .45}"/>`; return s; }
const lantai = (c = C.s2) => `<rect x="-200" y="${G}" width="1120" height="${H - G + 50}" fill="${c}"/><path d="M-200,${G} L920,${G}" ${ST(3, C.s4)}/>`;
const sorot = (x, y, r, a = .35) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#cahaya)" opacity="${a}"/>`;
const LATAR = {
  kamar: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="${C.s1}"/><rect x="420" y="250" width="220" height="250" rx="6" fill="#141416" ${ST(8, C.s4)}/><circle cx="560" cy="330" r="34" fill="${C.cahaya2}" opacity=".85"/><path d="M530,250 L530,500 M420,375 L640,375" ${ST(6, C.s4)}/>
    <rect x="430" y="${G - 120}" width="300" height="120" rx="14" fill="${C.s3}"/><rect x="440" y="${G - 150}" width="110" height="40" rx="14" fill="${C.s4}"/>
    <rect x="40" y="${G - 170}" width="220" height="16" fill="${C.s3}"/><path d="M70,${G - 154} L70,${G} M230,${G - 154} L230,${G}" ${ST(10, C.s3)}/><path d="M110,${G - 170} L130,${G - 250} L170,${G - 250}" ${ST(8, C.s4)} fill="none"/>${sorot(150, G - 230, 160, .5)}${lantai()}`,
  kelas: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="${C.s1}"/><rect x="120" y="220" width="480" height="230" rx="8" fill="#1A2721" ${ST(10, C.s4)}/><path d="M160,280 q40,-20 80,0 t80,0 M160,330 l140,0 M380,300 l120,40" ${ST(4, '#5F7A6A')} fill="none"/>
    ${[90, 360, 630].map(x => `<rect x="${x - 70}" y="${G - 70}" width="140" height="18" fill="${C.s3}"/><path d="M${x - 60},${G - 52} L${x - 60},${G} M${x + 60},${G - 52} L${x + 60},${G}" ${ST(8, C.s3)}/>`).join('')}
    ${[180, 540].map(x => `<path d="M${x},0 L${x},90" ${ST(3, C.s4)}/><path d="M${x - 40},90 L${x + 40},90 L${x + 26},110 L${x - 26},110 Z" fill="${C.s4}"/>${sorot(x, 130, 140, .3)}`).join('')}${lantai()}`,
  perpustakaan: t => { ACAK = 5; let rak = ''; for (const x0 of [-20, 250, 520]) { rak += `<rect x="${x0}" y="160" width="220" height="${G - 160}" fill="${C.s2}" ${ST(6, C.s4)}/>`; for (let y = 190; y < G - 40; y += 90) { rak += `<path d="M${x0},${y + 70} L${x0 + 220},${y + 70}" ${ST(6, C.s4)}/>`; let x = x0 + 10; while (x < x0 + 205) { const w = 12 + acak() * 16; rak += `<rect x="${x}" y="${y + 70 - (50 + acak() * 15)}" width="${w}" height="${50 + acak() * 15}" fill="${['#3A2F2A', '#2E3A45', '#46302C', '#30402F', '#3D3A2B'][Math.floor(acak() * 5)]}"/>`; x += w + 3; } } }
    return `<rect x="-200" y="0" width="1120" height="${G}" fill="${C.s1}"/>${rak}<path d="M360,0 L360,120" ${ST(3, C.s4)}/><circle cx="360" cy="135" r="18" fill="${C.cahaya}"/>${sorot(360, 160, 280, .45)}${lantai()}`; },
  kampus: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#0A0A0C"/>${bintang(40, 3)}<rect x="160" y="${G - 420}" width="400" height="420" fill="${C.s2}"/><path d="M140,${G - 420} L360,${G - 520} L580,${G - 420} Z" fill="${C.s3}"/>${jendelaKota(160, 400, 420, 9)}
    ${[60, 660].map(x => `<path d="M${x},${G} L${x},${G - 150}" ${ST(14, '#1B2018')}/><circle cx="${x}" cy="${G - 200}" r="70" fill="#1B241C"/>`).join('')}<path d="M110,${G} L110,${G - 260} L140,${G - 260}" ${ST(6, C.s4)} fill="none"/>${sorot(140, G - 250, 120, .45)}${lantai('#191B22')}`,
  kota: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#0A0A0C"/>${bintang(30, 4)}<circle cx="590" cy="170" r="44" fill="${C.cahaya2}" opacity=".8"/>
    ${[[-30, 140, 520], [100, 120, 380], [210, 150, 600], [350, 110, 430], [450, 140, 540], [580, 160, 400]].map(([x, w, h], i) => `<rect x="${x}" y="${G - h}" width="${w}" height="${h}" fill="${i % 2 ? C.s2 : C.s3}"/>${jendelaKota(x, w, h, 10 + i)}`).join('')}${lantai('#15171E')}`,
  pasar: t => { const lapak = (x, c1, c2) => `<path d="M${x},${G - 260} L${x + 200},${G - 260} L${x + 220},${G - 200} L${x - 20},${G - 200} Z" fill="${c1}"/>${[0, 1, 2, 3, 4].map(i => `<path d="M${x - 20 + i * 48},${G - 200} L${x + i * 40},${G - 260}" ${ST(14, c2)} opacity=".5"/>`).join('')}<path d="M${x},${G - 200} L${x},${G} M${x + 200},${G - 200} L${x + 200},${G}" ${ST(8, C.s4)}/><rect x="${x - 10}" y="${G - 90}" width="220" height="90" fill="${C.s3}"/>`;
    return `<rect x="-200" y="0" width="1120" height="${G}" fill="#0E0C0D"/>${lapak(20, '#3A2420', '#5A3326')}${lapak(270, '#22303A', '#2F4452')}${lapak(520, '#3A3320', '#56492A')}<path d="M-20,200 Q360,280 740,200" ${ST(3, C.s4)} fill="none"/>${[90, 230, 370, 510, 650].map((x, i) => `<circle cx="${x}" cy="${228 + Math.sin(i) * 12}" r="16" fill="${C.kar}"/>${sorot(x, 230, 70, .4 + .1 * Math.sin(t * 3 + i))}`).join('')}${lantai('#1A1716')}`; },
  desa: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#0A0A0C"/>${bintang(50, 6)}<circle cx="560" cy="190" r="52" fill="${C.cahaya2}" opacity=".85"/><path d="M-200,${G - 120} Q120,${G - 220} 380,${G - 130} T920,${G - 140} L920,${G} L-200,${G} Z" fill="#141C1E"/>
    ${[[80, 1], [480, .85]].map(([x, s]) => `<g transform="translate(${x} ${G}) scale(${s})"><path d="M0,0 L0,-90 M160,0 L160,-90" ${ST(10, C.s4)}/><rect x="-10" y="-200" width="180" height="110" fill="${C.s3}"/><path d="M-40,-200 L80,-300 L200,-200 Z" fill="${C.s4}"/><rect x="60" y="-170" width="40" height="50" fill="${C.cahaya}" opacity=".6"/></g>`).join('')}
    <path d="M330,${G} Q320,${G - 200} 360,${G - 330}" ${ST(12, '#1B1A16')} fill="none"/>${[0, 1, 2, 3, 4].map(i => `<path d="M360,${G - 330} q${-90 + i * 45},-30 ${-110 + i * 55},40" ${ST(10, '#1C2A1E')} fill="none"/>`).join('')}
    ${[0, 1, 2, 3, 4, 5].map(i => `<circle cx="${100 + i * 110 + Math.sin(t + i) * 14}" cy="${G - 200 - Math.cos(t * 1.3 + i) * 30}" r="3" fill="${C.cahaya}" opacity="${.4 + .4 * Math.sin(t * 4 + i)}"/>`).join('')}${lantai('#161A17')}`,
  istana: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#0E0B0C"/>${[60, 210, 510, 660].map(x => `<rect x="${x - 30}" y="140" width="60" height="${G - 140}" fill="${C.s3}"/><rect x="${x - 40}" y="130" width="80" height="24" fill="${C.s4}"/>`).join('')}
    ${[135, 585].map(x => `<path d="M${x - 40},160 L${x + 40},160 L${x + 40},420 L${x},380 L${x - 40},420 Z" fill="${C.kar}" opacity=".75"/>`).join('')}<path d="M300,${G} L300,${G - 260} Q360,${G - 330} 420,${G - 260} L420,${G} Z" fill="${C.s4}"/>
    ${[210, 510].map(x => `<path d="M${x},${G - 330} l-12,30 l24,0 Z" fill="${C.cahaya}"/>${sorot(x, G - 330, 120, .45 + .08 * Math.sin(t * 7 + x))}`).join('')}${lantai('#1C1418')}`,
  jalan: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#0A0A0C"/>${[[-20, 160, 360], [150, 120, 260], [500, 150, 330], [630, 120, 240]].map(([x, w, h], i) => `<rect x="${x}" y="${G - h}" width="${w}" height="${h}" fill="${C.s2}"/>${jendelaKota(x, w, h, 20 + i)}`).join('')}
    ${[120, 600].map(x => `<path d="M${x},${G} L${x},${G - 330} L${x + 40},${G - 330}" ${ST(8, C.s4)} fill="none"/><circle cx="${x + 40}" cy="${G - 322}" r="10" fill="${C.cahaya}"/><path d="M${x + 40},${G - 320} L${x - 50},${G} L${x + 130},${G} Z" fill="${C.cahaya}" opacity=".07"/>`).join('')}
    <rect x="-200" y="${G}" width="1120" height="400" fill="#16181F"/>${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${i * 140 - 40}" y="${G + 90}" width="70" height="10" fill="${C.s4}"/>`).join('')}`,
  panggung: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="#100A0E"/><path d="M-200,0 L120,0 Q60,400 120,${G} L-200,${G} Z M920,0 L600,0 Q660,400 600,${G} L920,${G} Z" fill="#3A1418"/>
    <path d="M360,0 L180,${G} L540,${G} Z" fill="${C.cahaya2}" opacity=".08"/>${sorot(360, G - 40, 260, .35)}<rect x="-200" y="${G}" width="1120" height="400" fill="#2A1E16"/><path d="M-200,${G} L920,${G}" ${ST(6, '#5A3E2A')}/>
    <rect x="150" y="${G + 120}" width="420" height="60" rx="8" fill="${C.s3}"/>${[240, 360, 480].map(x => `<circle cx="${x}" cy="${G + 100}" r="26" fill="${C.s4}"/>`).join('')}`,
  kantor: t => `<rect x="-200" y="0" width="1120" height="${G}" fill="${C.s1}"/><rect x="60" y="180" width="600" height="300" fill="#101012" ${ST(8, C.s4)}/>${jendelaKota(60, 600, 300 + G - 480, 31).replace(/y="(\d+)"/g, (m, y) => `y="${Math.min(+y, 460)}"`)}
    ${[180, 540].map(x => `<rect x="${x - 110}" y="${G - 110}" width="220" height="16" fill="${C.s3}"/><rect x="${x - 50}" y="${G - 200}" width="100" height="70" rx="6" fill="#20304A"/><rect x="${x - 42}" y="${G - 192}" width="84" height="54" fill="#5C7FA8" opacity=".45"/>${sorot(x, G - 165, 100, .25)}`).join('')}${lantai()}`,
  kosong: t => `<rect x="-200" y="0" width="1120" height="${H}" fill="${C.bg}"/>${sorot(360, 640, 520, .22)}${bintang(25, 8)}`,
};

// ---------- PERAN, EKSPRESI ----------
const PERAN = {
  pelajar: {baju: '#3D7FD9', kepala: 'kulit', aks: r => ''}, mahasiswa: {baju: '#8E8E8E', kepala: 'kulit', aks: r => kacamata(r)},
  guru: {baju: '#4E7A5B', kepala: 'putih', aks: r => kacamata(r)},
  raja: {baju: '#B23A34', kepala: 'putih', aks: r => `<path d="M${-r * .75},${-r * .72} L${-r * .75},${-r * 1.35} L${-r * .38},${-r * 1.05} L0,${-r * 1.45} L${r * .38},${-r * 1.05} L${r * .75},${-r * 1.35} L${r * .75},${-r * .72} Z" fill="#E8B84B" stroke="#2A2A2A" stroke-width="2.5" stroke-linejoin="round"/>`},
  warga: {baju: '#9A9A9A', kepala: 'putih', aks: r => `<path d="M${-r * 1.45},${-r * .5} L0,${-r * 1.45} L${r * 1.45},${-r * .5} Z" fill="#D9B25C" stroke="#2A2A2A" stroke-width="2.5" stroke-linejoin="round"/><path d="M${-r * 1.3},${-r * .55} L${r * 1.3},${-r * .55}" stroke="#A8843C" stroke-width="2"/>`},
  pedagang: {baju: '#C9B79C', kepala: 'putih', aks: r => `<path d="M${-r * .95},${-r * .62} Q0,${-r * 1.4} ${r * .95},${-r * .62} Z" fill="#6B4A2E" stroke="#2A2A2A" stroke-width="2.5"/>`},
  juri: {baju: '#4A4F5C', kepala: 'putih', aks: r => kacamata(r)}, ibu: {baju: '#C9B79C', kepala: 'putih', rok: '#6B4A2E', aks: r => `<path d="M${-r * .95},${-r * .1} Q${-r},${-r * 1.05} 0,${-r * 1.02} Q${r},${-r * 1.05} ${r * .95},${-r * .1} Q${r * .9},${-r * .7} 0,${-r * .72} Q${-r * .9},${-r * .7} ${-r * .95},${-r * .1} Z" fill="#1E1E20"/>`},
  ayah: {baju: '#7A6A5A', kepala: 'putih', aks: r => `<path d="M${-r * .3},${r * .25} Q0,${r * .14} ${r * .3},${r * .25}" stroke="#2A2A2A" stroke-width="4" fill="none" stroke-linecap="round"/>`},
  anak: {baju: '#3D7FD9', kepala: 'kulit', aks: r => '', skala: .74}, teman: {baju: '#F2C230', kepala: 'kulit', aks: r => `<path d="M${-r * .92},${-r * .42} Q0,${-r * 1.3} ${r * .92},${-r * .42} Z M${-r * .92},${-r * .46} L${-r * 1.5},${-r * .34}" fill="#B23A34" stroke="#2A2A2A" stroke-width="2.5"/>`},
  petugas: {baju: '#2F3A52', kepala: 'putih', aks: r => `<path d="M${-r * .95},${-r * .62} L${r * .95},${-r * .62} L${r * .78},${-r * 1.18} L${-r * .78},${-r * 1.18} Z" fill="#1E2433" stroke="#2A2A2A" stroke-width="2.5"/><circle cx="0" cy="${-r * .92}" r="${r * .1}" fill="#E8B84B"/>`},
};
function kacamata(r) { return `<circle cx="${-r * .34}" cy="${-r * .06}" r="${r * .22}" fill="none" stroke="#2A2A2A" stroke-width="2.4"/><circle cx="${r * .34}" cy="${-r * .06}" r="${r * .22}" fill="none" stroke="#2A2A2A" stroke-width="2.4"/><path d="M${-r * .12},${-r * .06} L${r * .12},${-r * .06}" stroke="#2A2A2A" stroke-width="2.4"/>`; }
const GR = (r, w = .075) => `stroke="#222" stroke-width="${Math.max(2, r * w)}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
const titik = r => [-1, 1].map(s => `<circle cx="${s * r * .32}" cy="${-r * .04}" r="${r * .065}" fill="#222"/>`).join('');
const alis2 = (r, kiri, kanan) => [[-1, kiri], [1, kanan]].map(([s, a]) => `<path d="M${s * r * .5},${-r * .3 + a * r * .08 * -1} L${s * r * .16},${-r * .3 + a * r * .08}" ${GR(r, .085)}/>`).join('');
const EKSPRESI = {
  datar: r => titik(r) + `<path d="M${-r * .14},${r * .34} L${r * .14},${r * .34}" ${GR(r)}/>`,
  senang: r => titik(r) + `<path d="M${-r * .22},${r * .26} Q0,${r * .46} ${r * .22},${r * .26}" ${GR(r)}/>`,
  sedih: r => titik(r) + alis2(r, -1, -1) + `<path d="M${-r * .18},${r * .42} Q0,${r * .28} ${r * .18},${r * .42}" ${GR(r)}/>`,
  kaget: r => [-1, 1].map(s => `<circle cx="${s * r * .32}" cy="${-r * .04}" r="${r * .13}" fill="#fff" ${GR(r, .06)}/><circle cx="${s * r * .32}" cy="${-r * .04}" r="${r * .05}" fill="#222"/>`).join('') + `<ellipse cx="0" cy="${r * .4}" rx="${r * .1}" ry="${r * .14}" fill="#222"/>` + alis2(r, -1.6, -1.6),
  marah: r => titik(r) + alis2(r, 1.4, 1.4) + `<path d="M${-r * .16},${r * .38} L${r * .16},${r * .38}" ${GR(r)}/>`,
  bingung: r => titik(r) + alis2(r, 0, -1.6) + `<path d="M${-r * .18},${r * .36} q${r * .09},${-r * .08} ${r * .18},0 t${r * .18},0" ${GR(r)}/>`,
  takut: r => [-1, 1].map(s => `<circle cx="${s * r * .32}" cy="${-r * .04}" r="${r * .11}" fill="#fff" ${GR(r, .06)}/><circle cx="${s * r * .32}" cy="${-r * .03}" r="${r * .04}" fill="#222"/>`).join('') + alis2(r, -1.2, -1.2) + `<path d="M${-r * .18},${r * .4} q${r * .09},${-r * .08} ${r * .18},0 t${r * .18},0" ${GR(r)}/><path d="M${r * .78},${-r * .3} q${r * .1},${r * .2} 0,${r * .26} q${-r * .1},${-r * .06} 0,${-r * .26}Z" fill="#8FC1E8"/>`,
  bangga: r => [-1, 1].map(s => `<path d="M${s * r * .32 - r * .1},${-r * .02} Q${s * r * .32},${-r * .14} ${s * r * .32 + r * .1},${-r * .02}" ${GR(r)}/>`).join('') + `<path d="M${-r * .28},${r * .22} Q0,${r * .52} ${r * .28},${r * .22} Z" fill="#222"/>`,
  malu: r => titik(r) + `<path d="M${-r * .1},${r * .36} L${r * .1},${r * .36}" ${GR(r)}/>` + [-1, 1].map(s => `<ellipse cx="${s * r * .52}" cy="${r * .16}" rx="${r * .14}" ry="${r * .07}" fill="#E58A8A" opacity=".75"/>`).join(''),
  capek: r => [-1, 1].map(s => `<path d="M${s * r * .32 - r * .11},${-r * .04} L${s * r * .32 + r * .11},${-r * .04}" ${GR(r)}/>`).join('') + `<path d="M${-r * .12},${r * .36} L${r * .12},${r * .36}" ${GR(r)}/>`,
  licik: r => [-1, 1].map(s => `<path d="M${s * r * .32 - r * .11},${-r * .06} L${s * r * .32 + r * .11},${-r * .02}" ${GR(r)}/>`).join('') + alis2(r, 1, -1) + `<path d="M${-r * .18},${r * .32} Q${r * .05},${r * .42} ${r * .22},${r * .24}" ${GR(r)}/>`,
};

// ---------- AKSI (pose stickman) ----------
// Sudut lengan/kaki dalam derajat dari arah bawah, positif = menjauh dari badan. B = tekuk siku/lutut.
const IDLE = {lA: 14, lB: -8, rA: 14, rB: -8, lL: 7, lK: 0, rL: 7, rK: 0, miring: 0, kepala: 0, dy: 0, dx: 0};
const AKSI = {
  diam: {dur: 1, f: (p, u) => ({})},

  if (k.data.length) {

      atas += `<g transform="translate(70 ${195 + j * 100})"><text y="-10" font-size="24" font-weight="700" fill="#E8E8E8" font-family="Mont">${d.label}</text><rect y="0" width="${w}" height="52" rx="12" fill="${terakhir ? C.cahaya : '#8E8E8E'}" stroke="#000" stroke-width="2"/><text x="${w + 14}" y="36" font-size="30" font-weight="800" fill="#FFFFFF" font-family="Mont">${String(Math.round(d.nilai * 10 * g) / 10).replace('.', ',')} ${d.satuan || ''}</text></g>`; });
  }

    atas += `<g transform="translate(360 150) scale(${s * keluarK})" ><rect x="-300" y="0" width="600" height="${86 + k.kartu.butir.length * 92}" rx="22" fill="#141416" fill-opacity=".94" stroke="#E8A847" stroke-width="3"/><text x="0" y="56" text-anchor="middle" font-size="32" font-weight="800" fill="#E8A847" font-family="Mont">${k.kartu.judul}</text>

  }

  for (const kk of KT) if (kk !== k && kk.kartu && t >= kk.kartu.mulai && t <= kk.kartu.selesai) {
    atas += `<g transform="translate(360 150) scale(${1 - cl((t - (kk.kartu.selesai - .25)) / .25)})"><rect x="-300" y="0" width="600" height="${86 + kk.kartu.butir.length * 92}" rx="22" fill="#141416" fill-opacity=".94" stroke="#E8A847" stroke-width="3"/><text x="0" y="56" text-anchor="middle" font-size="32" font-weight="800" fill="#E8A847" font-family="Mont">${kk.kartu.judul}</text>${kk.kartu.butir.map((b, j) => `<g transform="translate(-270 ${96 + j * 92})"><rect width="54" height="54" rx="12" fill="${t >= b.t ? C.cahaya : 'none'}" stroke="#E8A847" stroke-width="3"/>${t >= b.t ? `<path d="M12,28 L24,40 L44,14" ${ST(8, '#fff')} fill="none"/>` : ''}${teksButir(b.teks, t >= b.t ? '#FFFFFF' : '#7A7A7A')}</g>`).join('')}</g>`;
  }
  const ataA = KT.slice(0, i + 1).reverse().find(x => x.ata && t >= x.ata.mulai && t <= x.ata.selesai)?.ata || (KT[i + 1]?.ata && KT[i + 1].ata.masuk === 'sapuan' && t >= KT[i + 1].ata.mulai ? KT[i + 1].ata : null);
  const capX = 360;

  const src = (k.fakta || k.data.length) && TL.sumber_layar ? `<text x="360" y="1250" text-anchor="middle" font-size="17" fill="${C.krem}" opacity=".7" font-family="Baloo">${TL.sumber_layar.replace(/&/g, '&amp;')}</text>` : '';
  $('layar').innerHTML = `<defs><radialGradient id="cahaya"><stop offset="0" stop-color="${C.cahaya}" stop-opacity=".9"/><stop offset="1" stop-color="${C.cahaya}" stop-opacity="0"/></radialGradient>
    <radialGradient id="vinyet" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient></defs>
    ${dunia}${debu(t)}<rect width="720" height="1280" fill="url(#vinyet)"/><rect width="720" height="1280" fill="#000" opacity="${pindahLatar}"/>${atas}${cap}${src}`;
  // Ata
  const e = $('ata'), a = ataA;
  if (!a) { e.style.opacity = 0; return; }
  const src2 = `/aset/maskot/panda/pose/${a.pose}.svg`; if (!e.src.endsWith(src2)) e.src = src2;
  const u = t - a.mulai, lebarA = a.pose === 'mengintip' ? 260 : 290, sisi = a.tempat === 'kiri' ? -1 : 1;
  let x = a.tempat === 'kiri' ? 20 : a.tempat === 'tengah' ? 360 - lebarA / 2 : 700 - lebarA, y = 1230 - lebarA, sc = 1, rot = 0, op = 1;
  const habis = cl((a.selesai - t) / .15);
  if (a.masuk === 'intip') { const k2 = keluar(u / .35); x = sisi > 0 ? 720 - lebarA * .62 * k2 : -lebarA + lebarA * .62 * k2; y = 560; }
  if (a.masuk === 'pop') sc = pantul(u / .28);
  if (a.masuk === 'sapuan' && u < .45) { const k2 = ez(cl(u / .45)); x = -250 + (x + 250) * k2; y = -350 + (y + 350) * k2; rot = -150 * (1 - k2); sc = 1 + 2.6 * Math.sin(k2 * Math.PI); }
  e.style.width = lebarA + 'px'; e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.opacity = op * habis;
  e.style.transform = `rotate(${rot}deg) scale(${sc * (sisi < 0 && a.pose !== 'mengintip' ? -1 : 1)}, ${sc})`;
};
