<!doctype html><html><head><meta charset="utf-8"><title>Uji 3D Lumi dan Jago</title>
<style>

</style></head><body>

</div>

const tepi=(m,c=0x2B3245)=>{m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),new THREE.LineBasicMaterial({color:c})));return m};

// tanah, jalan, bukit, pohon, batu

 [[-22,-46,14,0xE4C9A8],[16,-52,16,0xDDBE98],[34,-34,11,0xE4C9A8],[-34,-24,10,0xD8B896],[4,-70,22,0xE7CFB0]].forEach(([x,z,s,c])=>{const h=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),M(c));h.scale.y=.32;add(h,x,0,z,false)});
 const pohon=(x,z,s)=>{const t=new THREE.Mesh(new THREE.CylinderGeometry(.14*s,.2*s,.9*s,6),M(0x7A5230));add(t,x,.45*s,z);const k=new THREE.Mesh(new THREE.ConeGeometry(.95*s,2.3*s,7),M(0x8AA07A));add(k,x,1.9*s,z);const k2=new THREE.Mesh(new THREE.ConeGeometry(.7*s,1.6*s,7),M(0x9BB088));add(k2,x,2.8*s,z)};
 [[-4.6,-7,1],[-6,-13,1.2],[5.8,-9,1.1],[6.6,-16,1.3],[-7,-21,1.2],[5,-24,1],[-5.4,-1.5,.9],[6.4,-3,.9],[-9,-9,1.4],[9,-12,1.3]].forEach(a=>pohon(...a));
 [[-2.8,1.6,.35],[3.9,1.9,.3],[-3.6,-11,.45],[3.4,-14,.4]].forEach(([x,z,s])=>add(new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),M(0xD9B892)),x,s*.6,z));}

async function tekstur(url){const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(im,0,0,1024,1024);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

// ---------- linimasa ----------
const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const G=Object.fromEntries(TL.garis.map(g=>[g.id,g]));

 [9.0,[-0.4,3.4,9.4,-0.5,1.7,-3.4]],[13.1,[-0.3,3.9,8.4,-0.5,2.1,-3.4]],[13.9,[2.0,2.6,6.8,2.6,1.5,-1.3]],[16.9,[2.2,2.5,6.2,2.7,1.5,-1.3]],[17.6,[0.8,3.6,9.0,0.6,2.2,-12]],[TL.durasi,[0.7,4.4,8.0,0.6,2.8,-31]]];

const JP=[[0,[1.8,0.9]],[8.5,[1.8,0.9]],[9.2,[3.4,-1.3]],[17.3,[3.4,-1.3]],[TL.durasi,[1.4,-8.8]]];
function bicara(id,t){const g=TL.garis.find(g=>g.tokoh===id&&t>=g.mulai&&t<=g.selesai);return g?1:0}
function kataSaatIni(t){for(const g of TL.garis){if(t<g.mulai-0.02||t>g.selesai+0.25)continue;let w=null;for(const k of g.kata)if(t>=k.a-0.03)w=k;return w?{w:w.w.replace(/[.,]/g,''),g}:null}return null}
function proyek(v){const p=v.clone().project(cam);return[(p.x*.5+.5)*W,(-p.y*.5+.5)*H,p.z]}
const loncat=(t,t0,d,h)=>{const k=(t-t0)/d;return k>0&&k<1?4*h*k*(1-k):0};
window.render=function(t){
 const c=kf(t,KAM);const dr=Math.sin(t*.9)*.05;cam.position.set(c[0]+dr,c[1]+Math.sin(t*.7)*.03,c[2]);cam.lookAt(c[3],c[4],c[5]);

 // api: Lumi = meter paham
 const paham=cl((t-E.pilar[2])/2.2)*(t<17.6?1:0.7);LUMI.gl.material.opacity=.3+.7*paham+Math.sin(t*23)*.06;const gs=LUMI.S*(.42+.45*paham);LUMI.gl.scale.set(gs,gs,1);
 JAGO.gl.material.opacity=.35+Math.sin(t*19)*.08;

   lb.querySelector('b').textContent=Math.round([6,18,42][i]*cl((t-t0)/d))+'%';const pu=i==2?1+.25*Math.max(0,Math.sin(cl((t-E.angka42)/.35)*Math.PI)):1;lb.style.transform=`translate(-50%,-100%) scale(${pu})`}});
 // chip per bagian
 const chip=$('chip');let ct='',ci='1';if(t<G.b3.mulai-0.1){ct='MITOS: KURANG PINTAR'}else if(t<G.b4.mulai-0.1){ct='FAKTA: SALAH BACA ATURAN';ci='2'}else if(t<E.penutup){ct='TRIK LEGAL';ci='3'}
 const ub=[0,G.b3.mulai-0.1,G.b4.mulai-0.1].reduce((a,x)=>t>=x?x:a,0);const pk=cl((t-ub-0.15)/.22);
 chip.style.opacity=ct?(t<0.25?cl((t-0.05)/.2):1):0;chip.style.transform=`translateX(-50%) scale(${.88+.12*ez(pk)})`;$('chipT').textContent=ct;chip.querySelector('i').textContent=ci;
