# Gerbang QA (scripts/qa.py). Dikalibrasi ulang dari 11 referensi (2026-11-05): 9 dari 11 lolos semua batas.
target_gerak:
  gerak_rata_min: 6.0        # median 11 referensi 7,7
  persen_diam_maks: 10       # median 3
  diam_terpanjang_maks: 1.5  # median 0,5
  beda_3dtk_min: 24          # median 34,9; video merak 24,4 dan tikus-ular 26,9 tetap lolos
# Rasa gambar (scripts/ukur_fx.py), 6 video mindwander 03, 07 sampai 11. Info di laporan QA, bukan gerbang.
target_visual:
  terang: [11, 49]            # median 28; hasil kita sesudah vinyet + grain: 42,6
  sudut_per_tengah: [0.03, 0.34]  # median 0,14; kita dulu 0,35 sampai 0,52, sekarang 0,22
  grain: [1.8, 4.8]           # median 2,8 (video 11 gaya garis 15,2 dikecualikan); kita 2,58
# Editing terukur dari frame referensi (render/mesin.html): caption satu kata Roboto Bold ±27 px di tengah, tinggi 43%;
# watermark Roboto Bold ±40 px abu-abu ±42% transparan, berpindah di pita atas (7 sampai 11% tinggi) tiap 9 dtk.
# Durasi dan tempo (scripts/analisis_referensi.py): mindwander 64 sampai 87 dtk, 2,7 sampai 3,45 kata/dtk.
durasi:
  referensi_dtk: [82.8, 43.6, 60.8, 89.0, 47.5, 63.7, 69.6, 65.9, 74.7, 87.3]
  sasaran_min: 45
  sasaran_maks: 80
  batas_min: 30
  batas_maks: 95
  kata_per_detik_referensi: [2.50, 2.33, 3.11, 2.50, 2.06, 2.86, 3.11, 2.70, 3.45, 2.82]   # median 2,8
# Palet terukur (scripts/ukur_palet.py) dari video 03 dan 07 sampai 11: porsi terbesar hampir hitam hangat.
palet:
  dasar: ["#0D0B09", "#0F0D0B", "#171715", "#1B140D", "#090909"]
  lapis: ["#312A1C", "#3A352E", "#3E2D20", "#2D2E26", "#372D1F"]
  tengah: ["#554C37", "#625235", "#57534F", "#494F49", "#6B462A"]
  terang: ["#DFCEAD", "#E6E5E5", "#F0EBE1", "#CEC8BA", "#B6AFAD"]
  aksen_tetap: ["#D09C27", "#F2B80E", "#A58859"]       # emas: aksen tetap semua video
  aksen_contoh: ["#C1571C", "#8F4017", "#0F335B", "#426486"]   # oranye senja (pesawat), biru (merak): aksen khusus per video, maks 3
# Profil naskah (scripts/lint_naskah.py). ata: video Ata dengan KARTU trik. filosofi: formula mindwander (alegori atau kisah nyata →
# putaran → nama konsep → pemetaan → penutup paralel), tanpa KARTU dan tanpa maskot. Skill olah-reels memakai profil filosofi.
naskah:
  profil: filosofi
  profil_isi:
    ata: {wajib_kartu: true, maskot: Ata}
    filosofi: {wajib_kartu: false, maskot: null, kartu: false, latar_bawaan: false, bidikan_ketat: true, ajakan_boleh: true}   # ATA/KARTU lama dilewati; latar wajib dari ##ASET

# Mode kualitas (masukan pemilik: boleh menunggu lama demi hasil). motion_blur: render 60 fps lalu dicampur ke 30 fps.
render:
  motion_blur: true

# Tempo suara (scripts/tempo.py): ElevenLabs tidak bisa diatur cepat, jadi suara dipercepat lokal bila di bawah sasaran. Referensi 2,7 sampai 3,45 kata/dtk.
suara:
  tempo_sasaran: 2.7
  faktor_maks: 1.35
  faktor_min: 1.06
